name: Vulnerabilities

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly, because a dependency becomes vulnerable without anybody here
    # changing a line. A check that only runs on a diff would never report it.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - .
          - driver/azyncpgx
          - examples

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # go.mod names 1.27 with no patch: take the newest 1.27.x, not the
          # one the runner happens to have cached.
          check-latest: true

      # It reports what is reachable, not what is merely in go.sum, so a finding
      # here is a path this code can actually take.
      - name: govulncheck
        working-directory: ${{ matrix.module }}
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
